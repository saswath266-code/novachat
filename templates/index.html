<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NovaChat, an AI assistant powered by Gemini.">
    <title>NovaChat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <aside class="sidebar" aria-label="Chat controls">
            <button class="new-chat-btn" id="newChatButton" type="button">+ New Chat</button>
            <p class="sidebar-hint">Messages stay in this browser tab until you start a new chat.</p>
        </aside>

        <main class="chat-section">
            <header class="chat-header">
                <h1>🚀 NovaChat</h1>
            </header>

            <div class="chat-box" id="chatBox" aria-live="polite" aria-busy="false">
                <div class="welcome" id="welcome">
                    <h2>Welcome to NovaChat</h2>
                    <p>Your AI assistant powered by Gemini.</p>
                </div>
            </div>

            <form class="input-area" id="chatForm">
                <label class="sr-only" for="messageInput">Your message</label>
                <textarea
                    id="messageInput"
                    placeholder="Ask anything..."
                    rows="1"
                    maxlength="12000"
                    required
                ></textarea>
                <button id="sendButton" type="submit">Send</button>
            </form>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
